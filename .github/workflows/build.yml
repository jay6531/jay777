name: Build and Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name "TXT摸鱼神器" txt_moyu.py
      - name: Rename asset
        shell: pwsh
        run: Copy-Item "dist\TXT摸鱼神器.exe" "dist\TXT摸鱼神器-windows-x64.exe"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TXT摸鱼神器-windows-x64.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python3 -m pip install --upgrade pip pyinstaller
      - name: Build app
        run: python3 -m PyInstaller --noconfirm --windowed --name "TXT摸鱼神器" txt_moyu.py
      - name: Sign and zip
        run: |
          codesign --force --deep --sign - "dist/TXT摸鱼神器.app"
          ditto -c -k --keepParent "dist/TXT摸鱼神器.app" "dist/TXT摸鱼神器-macOS.zip"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TXT摸鱼神器-macOS.zip
